name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Job ID:', d.get('job',{}).get('id','n/a')); exit(0 if d.get('job') else 1)"
